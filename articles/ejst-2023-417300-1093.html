<meta content="Separation of asphaltenes into multiple sub-fractions is performed using different fractionation techniques which are investigated in this study. The method chosen depends on the parameter of interest such as solubility, molecular weight difference, polarity, etc. For this write-up, the methods reviewed include sequential elution fractionation, solvent extraction, sequential extraction, column chromatography, sequential precipitation, supercritical fluid extraction, etc. The yield and the quality of the fraction are the two important subjects for choosing the separation procedure. For example, the yield is influenced using different hydrocarbon liquids as a significant factor. In addition, the method of choice will determine the presence of co-precipitated resins or not. The advantages of some of the methods were highlighted as well as the future prospects and application of asphaltene." name="citation_abstract"/>
